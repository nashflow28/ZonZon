name: Backend CI/CD

# ⚠️ CE WORKFLOW DÉPLOIE SUR FLY.IO, QUI N'EST PLUS LA PRODUCTION.
# Depuis la session 76, la production est le VPS OVH derrière api.kore-innov.com ;
# Fly.io ne sert plus que de secours. Lancer ce workflow ne met donc PAS à jour
# le backend servi aux utilisateurs — mais applique quand même les migrations,
# la base TiDB étant partagée entre les deux.
# Procédure de déploiement réelle : voir CLAUDE.md → « Déployer le backend ».
#
# Déclenchement manuel uniquement, pour maîtriser le quota GitHub Actions
# (2 000 min/mois sur le plan gratuit pour un dépôt privé).
on:
  workflow_dispatch:

jobs:
  test-and-deploy:
    name: Test & Deploy (NestJS → Fly.io)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --passWithNoTests

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --app zonzon-backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
