name: CI

# Vérification globale manuelle pour éviter le doublon avec les workflows spécialisés.
on:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        continue-on-error: true
        run: npm run test

  admin-dashboard:
    name: Admin Dashboard (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'admin-dashboard/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  mobile_app:
    name: Mobile App (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        continue-on-error: true
        run: flutter analyze

      - name: Test
        continue-on-error: true
        run: flutter test
