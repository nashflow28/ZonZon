name: Flutter CI

# Le build APK est lancé manuellement pour éviter les coûts Actions.
on:
  workflow_dispatch:

jobs:
  test-and-build:
    name: Test & Build APK (Flutter → Android)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test test/

      - name: Decode google-services.json
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json

      - name: Build APK (release)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        # Pas de --dart-define=API_URL : la valeur par défaut de
        # mobile_app/lib/config/env.dart pointe déjà sur le backend de
        # production. Forcer une URL ici avait produit un APK compilé contre le
        # backend de secours, en retard de plusieurs déploiements.
        run: flutter build apk --release

      - name: Upload APK artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
