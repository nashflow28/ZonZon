name: Flutter CI

# Déclenchement manuel uniquement (Actions → Flutter CI → Run workflow), pour
# maîtriser la consommation du quota GitHub Actions : 2 000 min/mois sur le plan
# gratuit pour un dépôt privé. Un build Flutter coûte ~4 min sur Linux (×1).
#
# Ne pas remettre de condition `github.event_name == 'push'` sur les étapes :
# en déclenchement manuel l'événement vaut `workflow_dispatch`, et toutes les
# étapes de build seraient silencieusement ignorées — le job passerait au vert
# sans produire d'APK.
on:
  workflow_dispatch:

jobs:
  test-and-build:
    name: Test & Build APK (Flutter → Android)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test test/

      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json

      # Signature de release. Sans ces secrets, le build retombe sur la clé de
      # debug (avec avertissement) et produit un APK NON distribuable : le Play
      # Store le refuse, et il ne pourra jamais être mis à jour par un APK signé
      # en release.
      # Secrets à définir dans le dépôt :
      #   ANDROID_KEYSTORE_BASE64  : base64 -w0 zonzon-release.jks
      #   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      - name: Decode release keystore
        if: env.KEYSTORE_B64 != ''
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build APK (release)
        # Pas de --dart-define=API_URL : la valeur par défaut de
        # mobile_app/lib/config/env.dart pointe déjà sur le backend de
        # production. Forcer une URL ici avait produit un APK compilé contre le
        # backend de secours, en retard de plusieurs déploiements.
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
