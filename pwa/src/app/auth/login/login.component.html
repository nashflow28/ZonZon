<div class="auth-page zz-safe-top zz-safe-bottom">
  <div class="auth-header">
    <span class="brand">ZonZon</span>
    <span class="subtitle">Connectez-vous pour continuer</span>
  </div>

  @if (errorMessage()) {
    <div class="error-banner">{{ errorMessage() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" class="auth-page" style="padding: 0; gap: 20px;">
    <div class="field">
      <label for="phone">Téléphone</label>
      <app-phone-input
        id="phone"
        [inputId]="'phone'"
        placeholder="90 00 00 00"
        formControlName="phone"
      ></app-phone-input>
    </div>

    <div class="field">
      <label for="password">Mot de passe</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="••••••••"
        formControlName="password"
      />
    </div>

    <button type="submit" class="btn-primary" [disabled]="submitting()">
      {{ submitting() ? 'Connexion…' : 'Se connecter' }}
    </button>
  </form>

  <p class="switch-link">
    Pas encore de compte ?
    <a routerLink="/register">Inscrivez-vous</a>
  </p>
</div>
