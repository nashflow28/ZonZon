<div class="auth-page zz-safe-top zz-safe-bottom">
  <div class="auth-header">
    <span class="brand">ZonZon</span>
    <span class="subtitle">Créez votre compte</span>
  </div>

  @if (errorMessage()) {
    <div class="error-banner">{{ errorMessage() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" class="auth-page" style="padding: 0; gap: 20px;">
    <div class="field">
      <label for="firstName">Prénom</label>
      <input id="firstName" type="text" autocomplete="given-name" placeholder="Ama" formControlName="firstName" />
    </div>

    <div class="field">
      <label for="lastName">Nom</label>
      <input id="lastName" type="text" autocomplete="family-name" placeholder="Kodjo" formControlName="lastName" />
    </div>

    <div class="field">
      <label for="phone">Téléphone</label>
      <app-phone-input
        id="phone"
        [inputId]="'phone'"
        placeholder="90 00 00 00"
        formControlName="phone"
      ></app-phone-input>
    </div>

    <div class="field">
      <label for="password">Mot de passe</label>
      <input
        id="password"
        type="password"
        autocomplete="new-password"
        placeholder="6 caractères minimum"
        formControlName="password"
      />
    </div>

    <div class="field">
      <label>Je suis…</label>
      <div class="segmented">
        @for (option of roleOptions; track option.value) {
          <button
            type="button"
            [class.active]="selectedRole() === option.value"
            (click)="chooseRole(option.value)"
          >
            {{ option.label }}
          </button>
        }
      </div>
    </div>

    @if (selectedRole() === 'LIVREUR') {
      <div class="field">
        <label>Véhicule</label>
        <div class="segmented">
          @for (option of vehicleOptions; track option.value) {
            <button
              type="button"
              [class.active]="selectedVehicle() === option.value"
              (click)="chooseVehicle(option.value)"
            >
              {{ option.label }}
            </button>
          }
        </div>
      </div>
    }

    <button type="submit" class="btn-primary" [disabled]="submitting()">
      {{ submitting() ? 'Création…' : "Créer mon compte" }}
    </button>
  </form>

  <p class="switch-link">
    Déjà un compte ?
    <a routerLink="/login">Connectez-vous</a>
  </p>
</div>
