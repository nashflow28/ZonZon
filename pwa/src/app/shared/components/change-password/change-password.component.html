<div class="password-block">
  @if (!editing()) {
    <button type="button" class="row-btn" (click)="open()">
      <span>Modifier le mot de passe</span>
      <span class="chevron">›</span>
    </button>
  } @else {
    <div class="edit-card">
      <div class="field">
        <label for="currentPassword">Mot de passe actuel</label>
        <input id="currentPassword" type="password" [(ngModel)]="currentPassword" name="currentPassword" autocomplete="current-password" />
      </div>
      <div class="field">
        <label for="newPassword">Nouveau mot de passe</label>
        <input id="newPassword" type="password" [(ngModel)]="newPassword" name="newPassword" autocomplete="new-password" />
      </div>
      <div class="field">
        <label for="passwordConfirmation">Confirmation</label>
        <input id="passwordConfirmation" type="password" [(ngModel)]="confirmation" name="passwordConfirmation" autocomplete="new-password" />
      </div>
      @if (errorMessage()) {
        <div class="error-banner">{{ errorMessage() }}</div>
      }
      <div class="edit-actions">
        <button type="button" class="btn-secondary" (click)="cancel()">Annuler</button>
        <button type="button" class="btn-primary" [disabled]="saving()" (click)="save()">
          {{ saving() ? 'Modification…' : 'Modifier' }}
        </button>
      </div>
    </div>
  }
  @if (successMessage()) {
    <p class="saved-hint">{{ successMessage() }}</p>
  }
</div>
