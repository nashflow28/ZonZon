# fly.toml app configuration file generated for zonzon-backend on 2026-04-30T09:42:56Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'zonzon-backend'
primary_region = 'cdg'

[build]

[http_service]
  internal_port = 3050
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[http_service.concurrency]
  type = "connections"
  hard_limit = 100
  soft_limit = 80

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
